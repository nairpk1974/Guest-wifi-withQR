# FortiGate RADIUS clients. Values come from the environment (deploy/.env) - never hard-code secrets here.
# ipaddr = the source IP each FortiGate uses to reach this server (confirmed during discovery;
#          for Hyderabad this is normally its IP inside the site-to-site VPN / "set source-ip").
# shortname must match locations.nas_shortname in the database (fgt-blr / fgt-hyd).

client fgt-blr {
	ipaddr = $ENV{FGT_BLR_RADIUS_SOURCE_IP}
	secret = $ENV{RADIUS_SECRET_BLR}
	shortname = fgt-blr
	nas_type = other
	require_message_authenticator = auto
	limit_proxy_state = auto
}

client fgt-hyd {
	ipaddr = $ENV{FGT_HYD_RADIUS_SOURCE_IP}
	secret = $ENV{RADIUS_SECRET_HYD}
	shortname = fgt-hyd
	nas_type = other
	require_message_authenticator = auto
	limit_proxy_state = auto
}

# Local health check only (radclient from inside the container)
client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SECRET_LOCAL}
	shortname = localhost-test
}
