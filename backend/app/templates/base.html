<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Bessel Systems Guest Wi-Fi{% endblock %}</title>
<link rel="stylesheet" href="/static/guest/portal.css">
</head>
<body>
<header class="brand">
  <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
    <path d="M20 3 35 11.5v17L20 37 5 28.5v-17z" fill="#0b3d5c"/>
    <path d="M12 19a11 11 0 0 1 16 0M15 22.5a6.5 6.5 0 0 1 10 0" stroke="#3ec5c0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="26.5" r="2.2" fill="#3ec5c0"/>
  </svg>
  <div><strong>Bessel Systems</strong><span>Guest Wi-Fi</span></div>
</header>
<main class="card">
{% block content %}{% endblock %}
</main>
<footer class="foot">
  <a href="/portal/terms">Terms of use</a> · <a href="/portal/privacy">Privacy notice</a> · <a href="/portal/status">Connection status</a>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
