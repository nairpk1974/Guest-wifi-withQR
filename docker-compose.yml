# Bessel Systems - Centralized QR Guest Wi-Fi Management
# Usage: cp .env.example .env && ./scripts/gen-secrets.sh && docker compose up -d --build
name: bessel-guestwifi

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://guestwifi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/guestwifi
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
  RADIUS_API_KEY: ${RADIUS_API_KEY:?set RADIUS_API_KEY}
  ADMIN_BASE_URL: https://${ADMIN_HOST}:${HTTPS_PORT:-443}
  GUEST_BASE_URL: https://${GUEST_HOST}:${HTTPS_PORT:-443}
  MFA_ENFORCED: ${MFA_ENFORCED:-true}
  REQUIRE_SEPARATE_APPROVER: ${REQUIRE_SEPARATE_APPROVER:-false}
  ALLOWED_DURATIONS_HOURS: ${ALLOWED_DURATIONS_HOURS:-1,4,8,12}
  QR_REDEEM_WINDOW_MINUTES: ${QR_REDEEM_WINDOW_MINUTES:-120}
  CAPTIVE_TRIGGER_URL: ${CAPTIVE_TRIGGER_URL:-http://neverssl.com/}
  RADIUS_GROUP_NAME: ${RADIUS_GROUP_NAME:-BESSEL-GUEST}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  GUEST_PII_RETENTION_DAYS: ${GUEST_PII_RETENTION_DAYS:-180}
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-365}
  COA_SECRET_BLR: ${COA_SECRET_BLR:-}
  COA_SECRET_HYD: ${COA_SECRET_HYD:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  TZ: Asia/Kolkata

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "10" }

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guestwifi
      POSTGRES_USER: guestwifi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestwifi -d guestwifi"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build: ./backend
    image: bessel-guestwifi/backend:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [db_net, app_net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  worker:
    image: bessel-guestwifi/backend:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      backend: { condition: service_healthy }
    networks: [db_net, app_net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *logging

  frontend:
    build: ./frontend
    image: bessel-guestwifi/frontend:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    networks: [app_net]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  radius:
    build: ./deploy/freeradius
    image: bessel-guestwifi/radius:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      RADIUS_API_KEY: ${RADIUS_API_KEY}
      FGT_BLR_RADIUS_SOURCE_IP: ${FGT_BLR_RADIUS_SOURCE_IP:?set after discovery}
      FGT_HYD_RADIUS_SOURCE_IP: ${FGT_HYD_RADIUS_SOURCE_IP:?set after discovery}
      RADIUS_SECRET_BLR: ${RADIUS_SECRET_BLR:?set RADIUS_SECRET_BLR}
      RADIUS_SECRET_HYD: ${RADIUS_SECRET_HYD:?set RADIUS_SECRET_HYD}
      RADIUS_SECRET_LOCAL: ${RADIUS_SECRET_LOCAL:?set RADIUS_SECRET_LOCAL}
      TZ: Asia/Kolkata
    ports:
      - "${RADIUS_BIND_IP:-0.0.0.0}:1812:1812/udp"
      - "${RADIUS_BIND_IP:-0.0.0.0}:1813:1813/udp"
    depends_on:
      backend: { condition: service_healthy }
    networks: [app_net]
    logging: *logging

  nginx:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST}
      GUEST_HOST: ${GUEST_HOST:?set GUEST_HOST}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    ports:
      - "${HTTP_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/guestwifi.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/admin-allow.conf:/etc/nginx/admin-allow.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate --header \"Host: $${GUEST_HOST}\" https://127.0.0.1/portal/status || exit 1"]
      interval: 60s
      timeout: 5s
    logging: *logging

networks:
  db_net:
    internal: true        # PostgreSQL has no route outside the app containers
  app_net:
    driver: bridge

volumes:
  pgdata:
